# Sales CRM — served on port 8080 of the VM IP (no domain yet).
# A separate listener from innovault (which owns port 80); innovault's
# nginx config is not edited.
#
#   /                                                → sales-crm-web (127.0.0.1:3200)
#   /api/ /media/ /health /docs /redoc /openapi.json → sales-crm-api (127.0.0.1:8200)

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8200;
        include /etc/nginx/snippets/sales-crm-proxy.conf;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8200;
        include /etc/nginx/snippets/sales-crm-proxy.conf;
    }

    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8200;
        include /etc/nginx/snippets/sales-crm-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        include /etc/nginx/snippets/sales-crm-proxy.conf;
    }
}
